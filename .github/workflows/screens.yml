# Draws the screens of one finished analysis again, without a new assessment.
# Started by the API through workflow_dispatch. The repository is cloned, the file list is made again,
# and only the screens are drawn with the workspace's own model. The findings, the file purposes and the
# analysis status are not changed. The clone is deleted when the job ends. Nothing from the repository is executed.

name: screens

on:
  workflow_dispatch:
    inputs:
      analysis_id:
        description: "Analysis UUID created by the API"
        required: true
        type: string
      repo:
        description: "Target repository (owner/name)"
        required: true
        type: string
      ref:
        description: "Branch, tag, or commit (optional)"
        required: false
        type: string
        default: ""
      model_token:
        description: "One-time token for the workspace's own model key (set by the API)"
        required: true
        type: string
      draw_screens:
        description: "Must be true for screens to be drawn (set by the API)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANALYSIS_ID: ${{ inputs.analysis_id }}
      TARGET_REPO: ${{ inputs.repo }}
      TARGET_REF: ${{ inputs.ref }}
    steps:
      # The token is one-time and lasts ten minutes. Hide it from the log before any other step runs.
      - name: Hide the model token
        env:
          MODEL_TOKEN: ${{ inputs.model_token }}
        run: |
          if [ -n "$MODEL_TOKEN" ]; then echo "::add-mask::$MODEL_TOKEN"; fi

      - name: Check out the Cutover engine
        uses: actions/checkout@v4
        with:
          path: cutover

      - name: Validate inputs
        run: |
          set -euo pipefail
          [[ "$ANALYSIS_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "Bad analysis id"; exit 1; }
          [[ "$TARGET_REPO" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9_][A-Za-z0-9_.-]{0,99}$ ]] || { echo "Bad repository name"; exit 1; }
          if [ -n "$TARGET_REF" ]; then
            [[ "$TARGET_REF" =~ ^[A-Za-z0-9_./-]{1,200}$ && "$TARGET_REF" != *..* ]] || { echo "Bad ref"; exit 1; }
          fi

      - name: Clone the target repository
        env:
          TARGET_TOKEN: ${{ secrets.TARGET_READ_TOKEN }}
        run: |
          set -euo pipefail
          # The token is sent as an HTTP header, never in the URL, and is not printed.
          AUTH=$(printf 'x-access-token:%s' "$TARGET_TOKEN" | base64 -w0)
          git -c "http.extraheader=Authorization: Basic $AUTH" \
            clone --quiet "https://github.com/$TARGET_REPO.git" "$RUNNER_TEMP/target"
          if [ -n "$TARGET_REF" ]; then
            git -C "$RUNNER_TEMP/target" checkout --quiet --detach "$TARGET_REF"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Makes the same file list the first run made, so the screens are drawn from the same files.
      - name: Read the files again
        run: |
          set -euo pipefail
          python3 cutover/engine/cutover_discover.py \
            --path "$RUNNER_TEMP/target" --out "$RUNNER_TEMP/reports"

      - name: Draw the screens again with the chosen model
        if: inputs.draw_screens == true
        env:
          MODEL_TOKEN: ${{ inputs.model_token }}
          DRAW_SCREENS: ${{ inputs.draw_screens }}
          RUNNER_SECRET: ${{ secrets.RUNNER_SECRET }}
          CALLBACK_URL: ${{ secrets.CUTOVER_API_URL }}
        run: |
          python3 cutover/engine/model_purposes.py --screens-only \
            --records "$RUNNER_TEMP/reports/target/files.json" --source "$RUNNER_TEMP/target" \
            --callback "$CALLBACK_URL" --analysis-id "$ANALYSIS_ID"
