# Runs the discovery engine on one repository and sends the findings back to the Cutover API.
# Started by the API through workflow_dispatch. The repository is cloned into a temporary
# folder, analyzed, and deleted when the job ends. Nothing from the repository is executed.

name: analyze

on:
  workflow_dispatch:
    inputs:
      analysis_id:
        description: "Analysis UUID created by the API"
        required: true
        type: string
      repo:
        description: "Target repository (owner/name)"
        required: true
        type: string
      ref:
        description: "Branch, tag, or commit (optional)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANALYSIS_ID: ${{ inputs.analysis_id }}
      TARGET_REPO: ${{ inputs.repo }}
      TARGET_REF: ${{ inputs.ref }}
    steps:
      - name: Check out the Cutover engine
        uses: actions/checkout@v4
        with:
          path: cutover

      - name: Validate inputs
        run: |
          set -euo pipefail
          [[ "$ANALYSIS_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "Bad analysis id"; exit 1; }
          [[ "$TARGET_REPO" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9_][A-Za-z0-9_.-]{0,99}$ ]] || { echo "Bad repository name"; exit 1; }
          if [ -n "$TARGET_REF" ]; then
            [[ "$TARGET_REF" =~ ^[A-Za-z0-9_./-]{1,200}$ && "$TARGET_REF" != *..* ]] || { echo "Bad ref"; exit 1; }
          fi

      - name: Clone the target repository
        env:
          TARGET_TOKEN: ${{ secrets.TARGET_READ_TOKEN }}
        run: |
          set -euo pipefail
          # The token is sent as an HTTP header, never in the URL, and is not printed.
          AUTH=$(printf 'x-access-token:%s' "$TARGET_TOKEN" | base64 -w0)
          git -c "http.extraheader=Authorization: Basic $AUTH" \
            clone --quiet "https://github.com/$TARGET_REPO.git" "$RUNNER_TEMP/target"
          if [ -n "$TARGET_REF" ]; then
            git -C "$RUNNER_TEMP/target" checkout --quiet --detach "$TARGET_REF"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Page screenshots are off on the free tier: the report keeps the drawn page and its visible text instead.
      - name: Run the discovery engine
        run: |
          set -euo pipefail
          python3 cutover/engine/cutover_discover.py \
            --path "$RUNNER_TEMP/target" --out "$RUNNER_TEMP/reports"

      # File-level results go first, in chunks. If the free-tier cap stops them, the API has already
      # marked the analysis failed, so the findings are not sent.
      - name: Send file-level results in chunks
        id: files
        continue-on-error: true
        env:
          CALLBACK_URL: ${{ secrets.CUTOVER_API_URL }}
          RUNNER_SECRET: ${{ secrets.RUNNER_SECRET }}
        run: |
          set -euo pipefail
          python3 cutover/engine/post_files.py \
            --records "$RUNNER_TEMP/reports/target/files.json" \
            --callback "$CALLBACK_URL" --analysis-id "$ANALYSIS_ID"

      - name: Report a failed file upload
        if: steps.files.outcome == 'failure'
        env:
          CALLBACK_URL: ${{ secrets.CUTOVER_API_URL }}
          RUNNER_SECRET: ${{ secrets.RUNNER_SECRET }}
        run: |
          python3 cutover/engine/post_result.py \
            --error "Sending the file-level results failed. Check the workflow run for details." \
            --callback "$CALLBACK_URL" --analysis-id "$ANALYSIS_ID" || true

      - name: Send findings to the API
        if: steps.files.outcome == 'success' && steps.files.outputs.stopped != 'true'
        env:
          CALLBACK_URL: ${{ secrets.CUTOVER_API_URL }}
          RUNNER_SECRET: ${{ secrets.RUNNER_SECRET }}
        run: |
          set -euo pipefail
          python3 cutover/engine/post_result.py \
            --report "$RUNNER_TEMP/reports/target/findings.json" \
            --callback "$CALLBACK_URL" --analysis-id "$ANALYSIS_ID"

      - name: Report a failed run
        if: failure()
        env:
          CALLBACK_URL: ${{ secrets.CUTOVER_API_URL }}
          RUNNER_SECRET: ${{ secrets.RUNNER_SECRET }}
        run: |
          python3 cutover/engine/post_result.py \
            --error "The analysis job failed. Check the workflow run for details." \
            --callback "$CALLBACK_URL" --analysis-id "$ANALYSIS_ID" || true
