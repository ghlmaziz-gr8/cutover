name: engine-tests

# Runs the discovery engine's answer-key tests on the hosted runner for every change to main
# and every pull request, so a change that breaks the expected findings is caught before merge.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  answer-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the answer-key tests
        working-directory: engine
        run: python -m unittest test_discover.py -v

      - name: Run the model purpose tests (keys never printed, code copies refused)
        working-directory: engine
        run: python -m unittest test_model_purposes.py test_model_screens.py -v

      - name: Run the cost estimate tests (rates and sizing come from cost_rates.json)
        working-directory: engine
        run: python -m unittest test_cost_model.py -v

      - name: Run the legacy and document tests (ASP screens, legacy databases, metadata refused when it holds values)
        working-directory: engine
        run: python -m unittest test_legacy.py test_languages.py test_deeper_docs.py test_file_inventory.py -v

  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the Worker tests (access, roles, deletion records)
        run: node --test service/worker/test/api.test.mjs
      - name: Check the in-app guide still matches the page
        run: node --test service/app/test/guide.test.mjs
