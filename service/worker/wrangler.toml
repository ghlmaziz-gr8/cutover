# Cloudflare Worker for the Cutover API.
# Secrets are never stored here. Set them with:
#   wrangler secret put SUPABASE_ANON_KEY
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put GITHUB_DISPATCH_TOKEN
#   wrangler secret put RUNNER_SECRET
#   wrangler secret put GITHUB_APP_ID
#   wrangler secret put GITHUB_APP_PRIVATE_KEY

name = "cutover-api"
main = "src/index.mjs"
compatibility_date = "2025-01-01"

# Retention: delete expired analyses every day at 03:17 UTC.
[triggers]
crons = ["17 3 * * *"]

[vars]
# Supabase project URL (not a secret).
SUPABASE_URL = "https://tietnfdwkiiitgzuchra.supabase.co"
# The sign-in web app. The API only accepts browser calls from this origin.
APP_ORIGIN = "https://app.cutover.site"
# The GitHub repository that contains the analysis workflow (owner/name).
RUNNER_REPO = "ghlmaziz-gr8/cutover"
# Email (Resend). Emails stay off until both are set: the secret RESEND_API_KEY, and the sender below.
EMAIL_FROM = "Cutover <notices@cutover.site>"
# Cutover operators: the only people who can create customer workspaces.
# They cannot see a customer's data unless they are invited into that workspace.
OPERATOR_EMAILS = "ghlmaziz@gmail.com"
